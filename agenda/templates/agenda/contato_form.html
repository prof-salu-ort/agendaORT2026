{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Novo Contato</title>
    <link rel="stylesheet" href="{% static 'agenda/css/estilos.css'%}">
</head>
<body>
    <h1>Adicionar Novo Contato</h1>

    <form method="POST">

        {{ form.as_p }}

        <button type="submit">Salvar Contato</button>
        <a href="{% url 'agenda:home' %}">Voltar</a>
    </form>
</body>
</html>
