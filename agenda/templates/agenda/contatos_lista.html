{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Lista de contatos</title>
    <link rel="stylesheet" href="{% static 'agenda/css/estilos.css'%}">
</head>
<body>
  <h1>Meus contatos</h1>
  <a href="{% url 'agenda:home'%}">Voltar ao menu</a>

  <form method="GET" action="{% url 'agenda:contato_lista' %}">
      <input type="text" name="q" placeholder="Buscar por nome ou e-mail..." value="{{ request.GET.q|default:'' }}">
      <button type="submit" class="btn">Pesquisar</button>
  </form>

  {% if contatos %}
    <ul>
      {% for contato in contatos %}
        <li><a href="{% url 'agenda:contato_detalhe' contato.pk %}"><strong>{{ contato.nome }}</strong></a></li>
      {% endfor %}
    </ul>
  {% else %}
    <p>Nenhum contato cadastrado.</p>
  {% endif %}

<div>
        <form action="{% url 'logout' %}" method="post">
            {% csrf_token %}
            <button type="submit" class="btn">Sair</button>
        </form>
    </div>
</body>
</html>
